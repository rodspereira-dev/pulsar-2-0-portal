<!DOCTYPE html>
<!--
  01 Suítes — área do proprietário (GitHub Pages, repo pulsar-2-0-portal).

  Fonte versionada no repo pulsar-2.0 (portal_proprietario/proprietario.html);
  copie para a raiz do repo pulsar-2-0-portal a cada mudança.

  Junto com ele vai logo-01suites.png (cópia do logo.png, fundo transparente).

  O link que o proprietário recebe é proprietario.html#t=<código>. O código
  fica depois do "#" (não vai para servidor nenhum nem para logs) e é mandado
  só para a Edge Function "proprietario", que devolve a lista de relatórios e
  o HTML de cada um. O relatório abre como Blob (o Supabase não serve HTML
  renderizável direto — ver supabase/functions/proprietario/index.ts).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Seus relatórios · 01 Suítes</title>
<script>(function(){var t=null;try{t=localStorage.getItem('tema01suites')}catch(e){}
if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
document.documentElement.setAttribute('data-theme',t)})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f7f5f3;--line:#e5dfda;--ink:#1a1411;--ink2:#564e49;--ink3:#7d7570;--acc:#d23414;--acc-soft:#fcebe6;--bar:rgba(255,255,255,.92);color-scheme:light}
:root[data-theme="dark"]{--bg:#0b0706;--card:#150e0c;--line:#2c2320;--ink:#f2efec;--ink2:#bdb6b0;--ink3:#9a938d;--acc:#ff5a3a;--acc-soft:#2a140e;--bar:rgba(11,7,6,.92);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
.barra{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.barra img{height:30px;display:block}
.btn{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.icone-sol{display:none}:root[data-theme="dark"] .icone-sol{display:inline}:root[data-theme="dark"] .icone-lua{display:none}
main{max-width:760px;margin:0 auto;padding:26px 16px 50px}
h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--ink2);margin-top:4px}
.mes{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin:26px 0 10px}
.lista{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.item:hover{border-color:var(--acc)}
.item .tipo{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.item .tit{font-size:16px;font-weight:700;margin-top:1px}
.item .seta{color:var(--acc);font-size:20px;font-weight:700}
.aviso{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:14px 16px;margin-top:22px;color:var(--ink2)}
.rodape{margin-top:36px;font-size:12px;color:var(--ink3)}
.carregando{color:var(--ink3);margin-top:22px}
</style>
</head>
<body>
<div class="barra">
  <img src="logo-01suites.png" alt="01 Suítes">
  <button class="btn" id="btn-tema" type="button" aria-label="Alternar tema claro/escuro">
    <svg class="icone-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icone-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span>Tema</span></button>
</div>
<main>
  <h1 id="titulo">Seus relatórios</h1>
  <div class="sub" id="sub">Resultados dos seus imóveis administrados pela 01 Suítes.</div>
  <div id="conteudo"><p class="carregando">Carregando…</p></div>
  <p class="rodape">Este link é pessoal — não compartilhe. Dúvidas: fale com a 01 Suítes.</p>
</main>
<script>
const FUNCTION_URL = "https://bglldtpywgqmyjvklxau.supabase.co/functions/v1/proprietario";
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const TIPOS = {resultado: "Resultado mensal", declaracao: "Declaração do mês", performance: "Performance histórica"};
const ORDEM = {declaracao: 0, resultado: 1, performance: 2};

document.getElementById('btn-tema').onclick = function () {
  const r = document.documentElement, t = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', t);
  try { localStorage.setItem('tema01suites', t); } catch (e) {}
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const conteudo = document.getElementById('conteudo');
const aviso = txt => { conteudo.innerHTML = `<div class="aviso">${esc(txt)}</div>`; };

function codigo() {
  const h = new URLSearchParams(location.hash.slice(1)).get('t');
  return h || new URLSearchParams(location.search).get('t') || '';
}

async function abrir(t, arquivo, botao) {
  const antes = botao.querySelector('.seta').textContent;
  botao.querySelector('.seta').textContent = '…';
  try {
    const r = await fetch(`${FUNCTION_URL}?t=${encodeURIComponent(t)}&r=${encodeURIComponent(arquivo)}`);
    if (!r.ok) throw new Error(await r.text());
    const html = await r.text();
    location.href = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
  } catch (e) {
    alert('Não consegui abrir esse relatório agora. Tente de novo em instantes.\n\n' + e.message);
  } finally {
    botao.querySelector('.seta').textContent = antes;
  }
}

(async function () {
  const t = codigo();
  if (!t) { aviso('Link incompleto. Abra o link exatamente como recebeu da 01 Suítes.'); return; }
  let dados;
  try {
    const r = await fetch(`${FUNCTION_URL}?t=${encodeURIComponent(t)}`);
    if (!r.ok) { aviso(await r.text()); return; }
    dados = await r.json();
  } catch (e) {
    aviso('Não consegui carregar seus relatórios agora. Verifique a conexão e tente de novo.');
    return;
  }
  document.getElementById('titulo').textContent = `Olá, ${dados.nome}`;
  const rels = dados.relatorios || [];
  if (!rels.length) { aviso('Ainda não há relatórios publicados para você. Assim que o fechamento do mês for conferido, ele aparece aqui.'); return; }

  const porMes = {};
  rels.forEach(r => (porMes[r.mes] = porMes[r.mes] || []).push(r));
  conteudo.innerHTML = Object.keys(porMes).sort().reverse().map(ym => {
    const [a, m] = ym.split('-').map(Number);
    const itens = porMes[ym].sort((x, y) => (ORDEM[x.tipo] ?? 9) - (ORDEM[y.tipo] ?? 9) || String(x.imovel).localeCompare(String(y.imovel), 'pt-BR'));
    return `<div class="mes">${MESES[m - 1]} de ${a}</div><div class="lista">` + itens.map(r =>
      `<button class="item" type="button" data-arq="${esc(r.arquivo)}"><div><div class="tipo">${esc(TIPOS[r.tipo] || r.tipo)}</div>` +
      `<div class="tit">${esc(r.titulo)}</div></div><span class="seta">›</span></button>`).join('') + `</div>`;
  }).join('');
  conteudo.querySelectorAll('.item').forEach(b => b.onclick = () => abrir(t, b.dataset.arq, b));
})();
</script>
</body>
</html>
